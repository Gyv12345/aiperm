server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    # 修复 macOS 上的 SO_LINGER socket 选项问题
    connection-timeout: 20s
    keep-alive-timeout: 60s
spring:
  application:
    name: aiperm
  modulith:
    detection-strategy: explicitly-annotated
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true

  # Jackson配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: dev

  # MCP Server：把后台查询能力作为 MCP 工具暴露给 AI 客户端（Streamable HTTP，端点 /mcp）。
  # 默认关闭。启用方式：设置环境变量 MCP_ENABLED=true 与 MCP_API_KEY=<随机长串>，
  # 客户端请求头携带 X-API-Key: <MCP_API_KEY>。工具清单见 README「MCP Server」章节。
  ai:
    mcp:
      server:
        enabled: ${MCP_ENABLED:false}
        protocol: STREAMABLE
        type: SYNC
        name: aiperm
        version: 1.0.0

# 应用自定义配置
aiperm:
  mcp:
    api-key: ${MCP_API_KEY:}

# Sa-Token配置
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# SpringDoc API文档配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: AiPerm RBAC权限系统API
    description: 基于Spring Boot 4 + Sa-Token + JPA的RBAC权限管理系统
    version: 1.0.0
    contact:
      name: DevLoveCode
  packages-to-scan: com.devlovecode.aiperm.modules
